<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}录音分账核定{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <h1>录音分账核定台</h1>
  <nav>
    <a href="{{ url_for('web.index') }}">录音与申报</a>
    <a href="{{ url_for('web.versions_index') }}">核定版取数</a>
  </nav>
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flashes">
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer>区间均为含起日、不含止日；份额单位为整数万分比（10000 = 100%）。</footer>
</body>
</html>
